<!DOCTYPE html>
<html>
<head>
  <title>Our Sky</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    .section {
      height: 50vh;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .overlay {
      position: absolute;
      bottom: 65px; /* adjusted so it doesn't block controls */
      right: 12px;
      background: rgba(0, 0, 0, 0.28);
      padding: 10px;
      border-radius: 10px;
      text-align: right;
      backdrop-filter: blur(4px);
    }

    .title {
      font-size: 16px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .timer {
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<!-- 🌿 Spica -->
<div class="section">
  <iframe src="https://stellarium-web.org/skysource/spica"></iframe>

  <div class="overlay">
    <div class="title">Spica 🌿</div>
    <div class="subtitle">May Night Star</div>
    <div class="timer" id="spicaTimer"></div>
  </div>
</div>

<!-- 👁️ Aldebaran -->
<div class="section">
  <iframe src="https://stellarium-web.org/skysource/aldebaran"></iframe>

  <div class="overlay">
    <div class="title">Aldebaran 👁️</div>
    <div class="subtitle">Her Star</div>
    <div class="timer" id="aldebaranTimer"></div>
  </div>
</div>

<script>
function countdown(month, day, id) {
  function update() {
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, month, day);

    if (target < now) {
      target = new Date(year + 1, month, day);
    }

    const diff = target - now;

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);

    document.getElementById(id).innerText =
      d + "d " + h + "h remaining";
  }

  update();
  setInterval(update, 60000);
}

// 🌿 Her birthday (May 7)
countdown(4, 7, "spicaTimer");

// 👁️ Your birthday / Aldebaran season (Feb 14)
countdown(1, 14, "aldebaranTimer");
</script>

</body>
</html>
