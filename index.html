<!DOCTYPE html>
<html>
<head>
  <title>Our Sky</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      padding: 22px 16px 30px; /* more breathing space */
      max-width: 520px;
      margin: auto;
    }

    .header {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 22px;
      opacity: 0.9;
    }

    .card {
      height: 44vh;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      margin-bottom: 22px; /* more gap between cards */
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .overlay {
      position: absolute;
      bottom: 75px; /* adjusted for better balance */
      right: 16px;
      background: rgba(0, 0, 0, 0.32);
      padding: 11px 14px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      text-align: right;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.75;
      margin-top: 3px;
    }

    .timer {
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">Our Sky</div>

  <!-- 🔴 Antares -->
  <div class="card">
    <iframe src="https://stellarium-web.org/skysource/antares"></iframe>

    <div class="overlay">
      <div class="title">Antares 🔴</div>
      <div class="subtitle">May Night Star</div>
      <div class="timer" id="antaresTimer"></div>
    </div>
  </div>

  <!-- 👁️ Aldebaran -->
  <div class="card">
    <iframe src="https://stellarium-web.org/skysource/aldebaran"></iframe>

    <div class="overlay">
      <div class="title">Aldebaran 👁️</div>
      <div class="subtitle">Her Star</div>
      <div class="timer" id="aldebaranTimer"></div>
    </div>
  </div>

</div>

<script>
function countdown(month, day, id) {
  function update() {
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, month, day);

    if (target < now) {
      target = new Date(year + 1, month, day);
    }

    const diff = target - now;

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);

    document.getElementById(id).innerText =
      d + "d " + h + "h remaining";
  }

  update();
  setInterval(update, 60000);
}

// 🔴 May 7
countdown(4, 7, "antaresTimer");

// 👁️ Feb 14
countdown(1, 14, "aldebaranTimer");
</script>

</body>
</html>
